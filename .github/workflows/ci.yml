name: CI

on:
  push:
    branches: [main, foundations]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          AUTH_SECRET: ci-build-placeholder-not-a-real-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
